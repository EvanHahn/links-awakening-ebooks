name: Post to Mastodon
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - run: ./post.sh lines.txt ${{ secrets.MASTODON_HOST }} ${{ secrets.MASTODON_TOKEN }}
